<!doctype html>
<html>

<head>
  <title>games by me </title>
</head>

<body>

  <p>Rock Paper Scissors</p>
  <button onclick=" 
   pointsResult('rock');
    ">Rock</button>
  <button onclick="
  
   pointsResult('paper');
  

  ">Paper</button>
  <button onclick="
  
   pointsResult('scissors');
  
  ">Scissors</button>
  <p class="resultOftheGame">ankit
  </p>
  <p class="move">a kit</p>
  <p class="showResult">ankit</p>

  <script>
    
    function pointsResult(playermove) {
       const computerMove= pickComputermove();
      let result='';
       if(playermove==='scissors'){
      if (computerMove === 'rock') {
        result = 'you lose';
      }
      else if (computerMove ==='paper' ) {
        result = 'you win';
      }
      else if (computerMove === 'scissors') {
        result = 'tie';
      }
    }
      else if(playermove==='rock'){
      if (computerMove === 'rock') {
        result = 'tie';
      }
      else if (computerMove ==='paper' ) {
        result = 'you lose';
      }
      else if (computerMove === 'scissors') {
        result = 'you win';
      }
    }
     else if(playermove==='paper'){
      if (computerMove === 'rock') {
        result = 'you win.';
      }
      else if (computerMove ==='paper' ) {
        result = 'tie.';
      }
      else if (computerMove === 'scissors') {
        result = 'you lose.';
      }
    }
    document.querySelector('.resultOftheGame').innerHTML=`${result}`;
document.querySelector('.move').innerHTML=` you ${playermove}- ${computerMove} computer`;


    alert(`you picked ${playermove}. computer picked ${computerMove}.${result}. `);
  
    }

    function pickComputermove() {

      const randomNumber = Math.random()
      if (randomNumber >= 0 && randomNumber < 1 / 3) {
        computerMove = 'rock';
      }
      else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
        computerMove = 'paper';
      }
      else if (randomNumber >= 2 / 3 && randomNumber < 1) {
        computerMove = 'scissor';
      }
      return computerMove;
    }
  </script>



</body>
