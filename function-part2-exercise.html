  function multipy(param, number) {
    return param * number;
  }
  console.log(multipy(2, 3));

  // 12k
  const oneLine = (para, num) => para * num;

  console.log(oneLine(2, 3));
  console.log(oneLine(7, 10));
  // 12l

  function countPostiveNumber(nums) {
    let positiveNumber = 0;

    nums.forEach((num) => {
      if (num > 0) {
        positiveNumber++;
      };

    });
    return positiveNumber;
  };

  console.log(countPostiveNumber([1, -3, 5, 4, 3]));
  // 12m

  function addNum(array, num) {


    return array.map((value) => value + num);


  }

  console.log(addNum([1, 2, 4], 2));
  console.log(addNum([-2,-1,0,99],2));
