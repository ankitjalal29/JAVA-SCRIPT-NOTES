    function minMax(nums) {
      const result = {
        max: null,
        min: null
      };
      for (let i = 0; i < nums.length; i++) {
        const number = nums[i];
        if (result.min === null || number < result.min) {
          result.min = number;
        }

        if (result.max === null || number > result.max) {
          result.max = number;
        }

      }

      return result;
    }
